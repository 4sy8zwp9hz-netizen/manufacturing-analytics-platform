[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "manufacturing-analytics-platform"
version = "0.2.0"
description = "A production-style semiconductor manufacturing analytics portfolio built with synthetic data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matthew Chung" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "jinja2>=3.1,<4.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.10,<3.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
manufacturing-analytics = "manufacturing_analytics.main:run"
generate-manufacturing-data = "manufacturing_analytics.scripts.generate_data:main"
benchmark-manufacturing-analytics = "manufacturing_analytics.scripts.benchmark_queries:main"

[tool.hatch.build.targets.wheel]
packages = ["src/manufacturing_analytics"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
