<form class="filter-panel" method="get" aria-label="Investigation filters">
  <div class="filter-heading">
    <div><p class="eyebrow">INVESTIGATION COHORT</p><h2>Filters</h2></div>
    <a href="{{ request.url.path }}">Reset</a>
  </div>
  <div class="filter-grid">
    <label>From date<input type="date" name="date_from" value="{{ filters.date_from or '' }}"></label>
    <label>To date<input type="date" name="date_to" value="{{ filters.date_to or '' }}"></label>
    <label>Product<select name="product_code"><option value="">All products</option>{% for option in options.products %}<option value="{{ option.value }}" {% if filters.product_code == option.value %}selected{% endif %}>{{ option.value }}</option>{% endfor %}</select></label>
    <label>Work order<select name="work_order_id"><option value="">All work orders</option>{% for option in options.work_orders %}<option value="{{ option.value }}" {% if filters.work_order_id == option.value %}selected{% endif %}>{{ option.value }}</option>{% endfor %}</select></label>
    <label>Lot<select name="lot"><option value="">All lots</option>{% for option in options.lots %}<option value="{{ option.value }}" {% if filters.lot_id == option.value %}selected{% endif %}>{{ option.value }}</option>{% endfor %}</select></label>
    <label>Operation<select name="operation_code"><option value="">Any exposure</option>{% for option in options.operations %}<option value="{{ option.value }}" {% if filters.operation_code == option.value %}selected{% endif %}>{{ option.value }} · {{ option.label }}</option>{% endfor %}</select></label>
    <label>Tool<select name="tool_id"><option value="">Any exposure</option>{% for option in options.tools %}<option value="{{ option.value }}" {% if filters.tool_id == option.value %}selected{% endif %}>{{ option.value }}</option>{% endfor %}</select></label>
    <button type="submit">Apply cohort</button>
  </div>
</form>
